<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>股票熱力圖 (Final Fix)</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fdfdfd; }
    header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fff; }
    h1 { margin: 0; font-size: 18px; }
    .toolbar { display:flex; gap:10px; padding: 10px 16px; border-bottom: 1px solid #e5e7eb; align-items: center; background: #fff; flex-wrap: wrap; }
    select, button, input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; }
    #chart { height: calc(100vh - 160px); width: 100%; }
    #msg { padding: 5px 16px; color: #d32f2f; font-size: 14px; height: 20px; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <h1>股票熱力圖 (成分股預覽)</h1>
  <div class="hint">修正說明：已移除 HoverTemplate 中的程式碼邏輯，改為預先計算文字，解決亂碼問題。</div>
</header>

<div class="toolbar">
  <input id="fileInput" type="file" accept=".csv,.xlsx,.json" />
  <button id="btnLoadDefault">載入範例 data.csv</button>
  <select id="selHorizon">
    <option value="1d">近1日</option>
    <option value="5d">近5日</option>
    <option value="20d">近20日</option>
    <option value="60d">近60日</option>
    <option value="ytd">YTD</option>
  </select>
  <select id="selMode">
    <option value="none">類股 → 股票</option>
    <option value="subcol">類股 → 子分類 → 股票</option>
  </select>
</div>

<div id="msg"></div>
<div id="chart"></div>

<script>
// --- 核心邏輯區 ---

// 1. 格式化工具
const formatPct = v => `${Number(v) > 0 ? '+' : ''}${Number(v).toFixed(1)}%`;
const formatNum = v => Number(v).toLocaleString();

// 2. 生成「Top 10 成分股」的 HTML 字串
function makeTop10Html(stockList, title) {
  // 排序：成交額大到小
  const top = [...stockList].sort((a, b) => b.value - a.value).slice(0, 10);
  
  let html = `<b>${title}</b><br>成交額前 10 大：<br>`;
  top.forEach((s, i) => {
    html += `${i + 1}. ${s.symbol} (${formatPct(s.change)})<br>`;
  });
  return html;
}

// 3. 資料標準化 (讀取 CSV/Excel 轉成統一格式)
function normalizeData(rawRows, horizon) {
  if (!rawRows || rawRows.length === 0) throw new Error("資料是空的");
  
  const headers = Object.keys(rawRows[0]);
  const findCol = (keywords) => headers.find(h => keywords.some(k => h.toLowerCase().includes(k)));

  const colGroup = findCol(['group', '產業', '類股']);
  const colSub = findCol(['sub', '子分類']);
  const colSymbol = findCol(['symbol', 'name', '名稱', '股票']);
  const colCode = findCol(['code', 'stock', '代碼']);
  const colVal = findCol([`amt_${horizon}`, `amount_${horizon}`, '成交額']);
  const colChg = findCol([`chg_${horizon}`, `change_${horizon}`, horizon, '漲跌']);

  if (!colVal || !colChg) throw new Error(`找不到期間 ${horizon} 的數值欄位`);

  return rawRows.map(r => {
    const val = parseFloat(String(r[colVal]).replace(/,/g, ''));
    return {
      group: String(r[colGroup] || '未分類').trim(),
      sub: String(r[colSub] || '其他').trim(),
      symbol: String(r[colSymbol] || '').trim(),
      code: String(r[colCode] || '').trim(),
      value: isNaN(val) ? 0 : val,
      change: parseFloat(String(r[colChg]).replace(/%/g, '')) || 0
    };
  }).filter(r => r.symbol && r.code && r.value > 0);
}

// 4. 繪圖主程式
function renderChart(rawRows) {
  try {
    const mode = document.getElementById('selMode').value;
    const horizon = document.getElementById('selHorizon').value;
    const rows = normalizeData(rawRows, horizon);

    // 我們把所有節點放進一個清單，這樣保證 index 對齊
    // 節點結構: { id, label, parent, value, color, hoverHtml }
    const nodes = [];

    // --- (A) 建立 Root 節點 ---
    nodes.push({
      id: 'root',
      label: '市場總覽',
      parent: '',
      value: 0, // Plotly 會自動加總
      color: 0,
      hoverHtml: '<b>市場總覽</b>'
    });

    // --- (B) 資料分組 ---
    const groups = {}; // { groupName: [rows...] }
    const subGroups = {}; // { "group|sub": [rows...] }

    rows.forEach(r => {
      // 收集類股
      if (!groups[r.group]) groups[r.group] = [];
      groups[r.group].push(r);

      // 收集子分類 (如果模式需要)
      if (mode === 'subcol') {
        const subKey = `${r.group}|${r.sub}`;
        if (!subGroups[subKey]) subGroups[subKey] = [];
        subGroups[subKey].push(r);
      }
    });

    // --- (C) 建立類股節點 (Layer 1) ---
    Object.keys(groups).forEach(gName => {
      const gRows = groups[gName];
      const totalVal = gRows.reduce((sum, r) => sum + r.value, 0);
      const avgChg = gRows.reduce((sum, r) => sum + (r.change * r.value), 0) / totalVal;

      nodes.push({
        id: `g^${gName}`, // 使用 ^ 避免與名稱衝突
        label: gName,
        parent: 'root',
        value: totalVal,
        color: avgChg,
        hoverHtml: makeTop10Html(gRows, gName) // ★ 這裡預先組好 Top 10 文字
      });
    });

    // --- (D) 建立子分類節點 (Layer 2, Optional) ---
    if (mode === 'subcol') {
      Object.keys(subGroups).forEach(key => {
        const [gName, sName] = key.split('|');
        const sRows = subGroups[key];
        const totalVal = sRows.reduce((sum, r) => sum + r.value, 0);
        const avgChg = sRows.reduce((sum, r) => sum + (r.change * r.value), 0) / totalVal;

        nodes.push({
          id: `s^${gName}^${sName}`,
          label: sName,
          parent: `g^${gName}`,
          value: totalVal,
          color: avgChg,
          hoverHtml: makeTop10Html(sRows, sName) // ★ 這裡也預先組好
        });
      });
    }

    // --- (E) 建立股票節點 (Leaf) ---
    rows.forEach(r => {
      const parentId = (mode === 'subcol') 
        ? `s^${r.group}^${r.sub}` 
        : `g^${r.group}`;
      
      // 股票的 Hover 內容，簡單明瞭
      const stockHover = `
        <b>${r.symbol} (${r.code})</b><br>
        漲跌幅: ${formatPct(r.change)}<br>
        成交額: ${formatNum(r.value)}
      `;

      nodes.push({
        id: `l^${r.code}`, // ID 包含代碼，點擊用
        label: `${r.symbol}<br>${formatPct(r.change)}`,
        parent: parentId,
        value: r.value,
        color: r.change,
        hoverHtml: stockHover
      });
    });

    // --- (F) 拆解成 Plotly 需要的陣列 ---
    // 重點：直接 map 出來，絕對不會錯位
    const data = [{
      type: 'treemap',
      branchvalues: 'total',
      ids: nodes.map(n => n.id),
      labels: nodes.map(n => n.label),
      parents: nodes.map(n => n.parent),
      values: nodes.map(n => n.value),
      customdata: nodes.map(n => n.hoverHtml), // ★ 將組好的 HTML 放進 customdata
      marker: {
        colors: nodes.map(n => n.color),
        colorscale: [
          [0, '#00a600'],   // 綠 (跌)
          [0.5, '#f3f4f6'], // 白 (平)
          [1, '#ff0000']    // 紅 (漲)
        ],
        cmid: 0
      },
      textinfo: 'label',
      // ★ 關鍵修正：這裡不做任何邏輯判斷，只單純顯示 customdata
      hovertemplate: '%{customdata}<extra></extra>'
    }];

    Plotly.newPlot('chart', data, {
      margin: {t:30, l:10, r:10, b:10}
    }, {displaylogo: false, responsive: true});

    // 綁定點擊事件
    document.getElementById('chart').on('plotly_treemapclick', (data) => {
      const pt = data.points[0];
      const id = pt.id;
      // 判斷 ID 是否以 'l^' 開頭 (代表是股票 Leaf)
      if (id && id.startsWith('l^')) {
        const code = id.split('^')[1];
        window.open(`https://www.fbs.com.tw/MKT/Index?name=%EF%BC%AB%E7%B7%9A%E5%9C%96&stock=${code}`, '_blank');
      }
      return false; // 阻止預設縮放行為
    });

    document.getElementById('msg').textContent = `繪製完成，共 ${rows.length} 檔股票`;

  } catch (e) {
    document.getElementById('msg').textContent = "錯誤：" + e.message;
    console.error(e);
  }
}

// --- 事件處理區 ---
let globalRawData = null;

const $file = document.getElementById('fileInput');
const $btnDef = document.getElementById('btnLoadDefault');
const $selMode = document.getElementById('selMode');
const $selHorizon = document.getElementById('selHorizon');

$file.addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const txt = await readFile(f);
  parseAndDraw(txt, f.name);
});

$btnDef.addEventListener('click', () => {
  fetch('./data.csv').then(r => r.text()).then(txt => parseAndDraw(txt, 'data.csv'));
});

$selMode.addEventListener('change', () => globalRawData && renderChart(globalRawData));
$selHorizon.addEventListener('change', () => globalRawData && renderChart(globalRawData));

function readFile(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    if (file.name.endsWith('.xlsx')) reader.readAsBinaryString(file);
    else reader.readAsText(file, 'UTF-8'); // 強制 UTF-8
  });
}

function parseAndDraw(content, filename) {
  let data;
  if (filename.endsWith('.xlsx')) {
    const wb = XLSX.read(content, {type: 'binary'});
    data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  } else if (filename.endsWith('.json')) {
    data = JSON.parse(content);
  } else {
    data = Papa.parse(content, {header: true, skipEmptyLines: true}).data;
  }
  globalRawData = data;
  renderChart(data);
}

// 預設載入
$btnDef.click();

</script>
</body>
</html>
