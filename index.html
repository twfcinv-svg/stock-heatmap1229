<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>股票熱力圖（成分股預覽版）</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

  <style>
    :root { --border:#e5e7eb; --muted:#6b7280; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 18px; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }
    .bar { display:flex; gap:10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
    button { padding: 8px 10px; border: 1px solid var(--border); background: #fff; border-radius: 10px; cursor:pointer; }
    button:hover { background:#f9fafb; }
    input[type="file"] { padding: 6px 0; }
    input[type="text"], select {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
      min-width: 220px; background:#fff;
    }
    #msg { padding: 0 16px 10px; color: #b91c1c; font-size: 13px; min-height: 18px; white-space: pre-wrap; }
    #chart { height: calc(100vh - 200px); }
    .ok { color: #047857 !important; }
    .drop {
      margin: 10px 16px 0;
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .pill { font-size:12px; padding:3px 8px; border:1px solid var(--border); border-radius:999px; color:var(--muted); }
    .timebar { margin-top: 8px; display:flex; gap:8px; flex-wrap: wrap; align-items:center; }
  </style>
</head>

<body>
  <header>
    <h1>股票熱力圖（滑鼠移至類股可預覽成分股）</h1>
    <div class="muted">
      預設讀取 <b>data.csv</b>。提示：類股節點現在會顯示成交量前 10 大的成分股預覽。
      <div class="timebar">
        <span id="clockNow" class="pill">現在時間：--</span>
        <span id="dataUpdated" class="pill">資料更新：--</span>
      </div>
    </div>
  </header>

  <div class="bar">
    <input id="file" type="file" accept=".csv,.xlsx,.xls,.json" />
    <button id="btnLoadDefault">載入 data.csv</button>
    <select id="horizon">
      <option value="1d" selected>近1日</option>
      <option value="5d">近5日</option>
      <option value="20d">近20日</option>
      <option value="60d">近60日</option>
      <option value="1y">近一年</option>
      <option value="ytd">YTD</option>
    </select>
    <select id="mode">
      <option value="none">單層：類股 → 股票</option>
      <option value="subcol">雙層：類股 → 子分類 → 股票</option>
      <option value="amountbin">雙層：類股 → 成交額分級 → 股票</option>
    </select>
    <button id="btnShare">產生連結</button>
    <button id="btnCopy" disabled>複製連結</button>
    <input id="csvUrl" type="text" placeholder="CSV 公開網址" />
    <button id="btnLoadUrl">載入網址</button>
  </div>

  <div class="drop">📥 拖曳檔案至此處直接載入。</div>
  <div id="msg"></div>
  <div id="chart"></div>

<script>
  const $msg = document.getElementById('msg');
  const $file = document.getElementById('file');
  const $btnLoadDefault = document.getElementById('btnLoadDefault');
  const $btnShare = document.getElementById('btnShare');
  const $btnCopy = document.getElementById('btnCopy');
  const $csvUrl = document.getElementById('csvUrl');
  const $btnLoadUrl = document.getElementById('btnLoadUrl');
  const $mode = document.getElementById('mode');
  const $horizon = document.getElementById('horizon');

  let lastRawRows = null;

  function setMsg(text, ok=false) {
    $msg.textContent = text || '';
    $msg.className = ok ? 'ok' : '';
  }

  function startClockNow() {
    const el = document.getElementById('clockNow');
    const fmt = new Intl.DateTimeFormat('zh-Hant-TW', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, timeZone:'Asia/Taipei' });
    setInterval(() => { if(el) el.textContent = `現在時間：${fmt.format(new Date())}`; }, 1000);
  }

  async function showDataUpdatedAt() {
    const el = document.getElementById('dataUpdated');
    try {
      const res = await fetch(`https://api.github.com/repos/twfcinv-svg/stock-heatmap1229/commits?path=data.csv&per_page=1`, { cache: 'no-store' });
      const arr = await res.json();
      const d = new Date(arr[0].commit.committer.date);
      if(el) el.textContent = `資料更新：${d.toLocaleString('zh-Hant-TW', { timeZone:'Asia/Taipei', hour12:false })}`;
    } catch (e) { if(el) el.textContent = `資料更新：未知`; }
  }

  function toNumber(x) {
    const s = String(x || '').trim().replace(/,/g,'').replace(/%/g,'');
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  function fmtPct(x) {
    const n = Number(x);
    if (!Number.isFinite(n)) return '0.0%';
    return `${n > 0 ? '+' : ''}${n.toFixed(1)}%`;
  }

  function pickColumn(headers, candidates) {
    const lower = headers.map(h => String(h).trim().toLowerCase());
    for (const c of candidates) {
      const idx = lower.indexOf(String(c).toLowerCase());
      if (idx >= 0) return headers[idx];
    }
    return null;
  }

  function changeCandidatesByHorizon(h) {
    const common = ['change','chg','漲跌幅','報酬'];
    const map = { '1d':['1d','近1日',...common], '5d':['5d','近5日',...common], '20d':['20d','月',...common], '60d':['60d','三月',...common], '1y':['1y','一年',...common], 'ytd':['ytd','今年以來',...common] };
    return map[h] || map['1d'];
  }

  function valueCandidatesByHorizon(h) {
    const map = { '1d':['amt_1d','成交額'], '5d':['amt_5d','5日成交額'], '20d':['amt_20d','20日成交額'], '60d':['amt_60d','60日成交額'], '1y':['amt_1y','一年成交額'], 'ytd':['amt_ytd','今年成交額'] };
    return map[h] || map['1d'];
  }

  /**
   * 格式化前 10 檔成分股為 HTML 字串，用於 Hover 顯示
   */
  function formatTop10(stockList) {
    // 依成交量排序，取前 10 名
    const top10 = stockList
      .sort((a, b) => b.value - a.value)
      .slice(0, 10);
    
    let str = "<b>前 10 大成分股：</b><br>";
    top10.forEach((s, idx) => {
      str += `${idx + 1}. ${s.symbol}: ${fmtPct(s.change)}<br>`;
    });
    return str;
  }

  function normalizeRows(rawRows, mode, horizon) {
    const headers = Object.keys(rawRows[0] || {});
    const colGroup = pickColumn(headers, ['group','產業','類股']);
    const colSub = pickColumn(headers, ['sub','子分類']);
    const colSymbol = pickColumn(headers, ['symbol','名稱','股票']);
    const colCode = pickColumn(headers, ['stock_code','代碼']);
    const colValue = pickColumn(headers, valueCandidatesByHorizon(horizon));
    const colChange = pickColumn(headers, changeCandidatesByHorizon(horizon));

    let rows = rawRows.map(r => {
      const symbol = String(r[colSymbol] || '').trim();
      const code = String(r[colCode] || '').trim();
      const val = toNumber(r[colValue]);
      if (!symbol || !code) return null;
      return {
        group: String(r[colGroup] || '未分類').trim(),
        sub: mode === 'subcol' ? String(r[colSub] || '未分類').trim() : '',
        symbol, code,
        value: val > 0 ? val : 1,
        change: toNumber(r[colChange]) || 0
      };
    }).filter(Boolean);

    if (mode === 'amountbin') {
      // 分級邏輯略... (保持原樣)
    }
    return rows;
  }

  function buildTreemap(rows, mode) {
    const ids = [], labels = [], parents = [], values = [], colors = [], customdata = [];
    ids.push('root'); labels.push('全部'); parents.push(''); values.push(0); colors.push(0); customdata.push('');

    const groupMap = new Map(); // 存放各類股的成員
    const subMap = new Map();   // 存放子分類的成員

    rows.forEach(r => {
      if (!groupMap.has(r.group)) groupMap.set(r.group, []);
      groupMap.get(r.group).push(r);

      if (mode !== 'none') {
        const key = `${r.group}||${r.sub}`;
        if (!subMap.has(key)) subMap.set(key, []);
        subMap.get(key).push(r);
      }
    });

    // 建立類股層級
    for (const [gname, members] of groupMap.entries()) {
      const totalVal = members.reduce((s, x) => s + x.value, 0);
      const avgChg = members.reduce((s, x) => s + (x.change * x.value), 0) / totalVal;
      ids.push(`g|${gname}`);
      labels.push(gname);
      parents.push('root');
      values.push(totalVal);
      colors.push(avgChg);
      // ★ 關鍵修改：將前 10 檔文字塞入 customdata
      customdata.push(formatTop10(members));
    }

    // 建立子分類層級
    if (mode !== 'none') {
      for (const [key, members] of subMap.entries()) {
        const [gname, sname] = key.split('||');
        const totalVal = members.reduce((s, x) => s + x.value, 0);
        const avgChg = members.reduce((s, x) => s + (x.change * x.value), 0) / totalVal;
        ids.push(`s|${gname}|${sname}`);
        labels.push(sname);
        parents.push(`g|${gname}`);
        values.push(totalVal);
        colors.push(avgChg);
        // ★ 關鍵修改
        customdata.push(formatTop10(members));
      }
    }

    // 建立股票層級
    rows.forEach(r => {
      const pid = (mode === 'none') ? `g|${r.group}` : `s|${r.group}|${r.sub}`;
      ids.push(`l|${r.group}|${r.sub}|${r.symbol}`);
      labels.push(`${r.symbol}<br>${fmtPct(r.change)}`);
      parents.push(pid);
      values.push(r.value);
      colors.push(r.change);
      // 股票層級顯示代碼，點擊用
      customdata.push(r.code);
    });

    values[0] = rows.reduce((s, x) => s + x.value, 0);
    return {ids, labels, parents, values, colors, customdata};
  }

  function render(rawRows) {
    const rows = normalizeRows(rawRows, $mode.value, $horizon.value);
    const tree = buildTreemap(rows, $mode.value);

    const data = [{
      type: 'treemap',
      ids: tree.ids,
      labels: tree.labels,
      parents: tree.parents,
      values: tree.values,
      customdata: tree.customdata,
      branchvalues: 'total',
      textinfo: 'label',
      marker: { colors: tree.colors, colorscale: [[0,'#1a9641'], [0.5,'#f3f4f6'], [1,'#d7191c']], cmid: 0 },
      // ★ 修改 HoverTemplate
      // %{customdata} 會抓取我們剛才塞進去的前 10 檔列表
      // 如果 id 開頭是 'l|' (股票)，我們改用簡短顯示，否則顯示成分股預覽
      hovertemplate: "%{id[0] === 'l' ? '股票：<b>%{label}</b>' : '%{customdata}'}<extra></extra>"
    }];

    Plotly.newPlot('chart', data, { margin: { l:10, r:10, t:30, b:10 } }, { responsive:true, displaylogo:false })
      .then(() => {
        document.getElementById('chart').on('plotly_treemapclick', (e) => {
          const pt = e.points[0];
          if (!pt.id.startsWith('l|')) return;
          window.location.href = `https://www.fbs.com.tw/MKT/Index?name=%EF%BC%AB%E7%B7%9A%E5%9C%96&stock=${encodeURIComponent(pt.customdata)}`;
          return false;
        });
      });
    setMsg('圖表已更新', true);
  }

  // 事件綁定略... (與原版相同)
  $file.addEventListener('change', e => e.target.files[0] && handleFile(e.target.files[0]));
  $btnLoadDefault.addEventListener('click', () => fetch('./data.csv').then(r => r.text()).then(t => { lastRawRows = Papa.parse(t, {header:true}).data; render(lastRawRows); }));
  $mode.addEventListener('change', () => lastRawRows && render(lastRawRows));
  $horizon.addEventListener('change', () => lastRawRows && render(lastRawRows));

  async function handleFile(file) {
    const buf = await file.arrayBuffer();
    const text = new TextDecoder().decode(buf);
    lastRawRows = Papa.parse(text, {header:true}).data;
    render(lastRawRows);
  }

  startClockNow();
  showDataUpdatedAt();
</script>
</body>
</html>
